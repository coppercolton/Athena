name: tests

on:
  push:
  pull_request:

jobs:
  behavioral-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python -m compileall -q athena examples tests
      - run: python tests/test_athena.py
